<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ESP32 GPS Logger — wiring</text>

  <!-- ===== ESP32 ===== -->
  <rect x="320" y="60" width="220" height="320" rx="6" fill="#f2f5fa" stroke="#222" stroke-width="2"/>
  <text x="430" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ESP32 DevKit</text>
  <text x="430" y="102" text-anchor="middle" font-size="11" fill="#555">MicroPython 1.29</text>
  <!-- left pins -->
  <g fill="#222" font-size="12">
    <text x="328" y="134">3V3</text>
    <text x="328" y="174">GND</text>
    <text x="328" y="224">GPIO16 (U2 RX)</text>
    <text x="328" y="264">GPIO17 (U2 TX)</text>
    <text x="328" y="344">GPIO25</text>
  </g>
  <!-- right pins -->
  <g fill="#222" font-size="12" text-anchor="end">
    <text x="532" y="134">3V3</text>
    <text x="532" y="174">GND</text>
    <text x="532" y="224">GPIO21 (SDA)</text>
    <text x="532" y="264">GPIO22 (SCL)</text>
  </g>
  <text x="430" y="372" text-anchor="middle" font-size="11" fill="#555">USB 5 V supply</text>

  <!-- ===== GPS ===== -->
  <rect x="40" y="100" width="150" height="190" rx="6" fill="#f2faf3" stroke="#222" stroke-width="2"/>
  <text x="115" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">GPS module</text>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#555">u-blox NEO-6M/7M/8M</text>
  <text x="115" y="156" text-anchor="middle" font-size="11" fill="#555">UART 9600 8N1</text>
  <g fill="#222" font-size="12" text-anchor="end">
    <text x="182" y="174">GND</text>
    <text x="182" y="224">TX</text>
    <text x="182" y="264">RX</text>
  </g>
  <text x="182" y="194" font-size="12" text-anchor="end" fill="#222">VCC</text>

  <!-- ===== OLED ===== -->
  <rect x="670" y="100" width="150" height="190" rx="6" fill="#faf5f0" stroke="#222" stroke-width="2"/>
  <text x="745" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">OLED</text>
  <text x="745" y="142" text-anchor="middle" font-size="11" fill="#555">SSD1306 128×64 I²C</text>
  <text x="745" y="156" text-anchor="middle" font-size="11" fill="#555">addr 0x3C</text>
  <g fill="#222" font-size="12">
    <text x="678" y="174">GND</text>
    <text x="678" y="194">VCC</text>
    <text x="678" y="224">SDA</text>
    <text x="678" y="264">SCL</text>
  </g>

  <!-- ===== wires: power ===== -->
  <!-- 3V3 rail left: ESP 3V3 (y130) -> GPS VCC (y190) -->
  <polyline points="320,130 255,130 255,190 190,190" fill="none" stroke="#d62828" stroke-width="2.5"/>
  <!-- GND left -->
  <line x1="320" y1="170" x2="190" y2="170" stroke="#222" stroke-width="2.5"/>
  <!-- 3V3 right -> OLED VCC (y190) -->
  <polyline points="540,130 605,130 605,190 670,190" fill="none" stroke="#d62828" stroke-width="2.5"/>
  <!-- GND right -->
  <line x1="540" y1="170" x2="670" y2="170" stroke="#222" stroke-width="2.5"/>

  <!-- ===== wires: UART (crossed) ===== -->
  <line x1="190" y1="220" x2="320" y2="220" stroke="#1d6fd6" stroke-width="2.5"/>
  <line x1="190" y1="260" x2="320" y2="260" stroke="#2a9d3f" stroke-width="2.5"/>
  <text x="255" y="214" text-anchor="middle" font-size="11" fill="#1d6fd6">GPS TX → ESP RX</text>
  <text x="255" y="254" text-anchor="middle" font-size="11" fill="#2a9d3f">ESP TX → GPS RX</text>

  <!-- ===== wires: I2C ===== -->
  <line x1="540" y1="220" x2="670" y2="220" stroke="#8e44ad" stroke-width="2.5"/>
  <line x1="540" y1="260" x2="670" y2="260" stroke="#e08a00" stroke-width="2.5"/>
  <text x="605" y="214" text-anchor="middle" font-size="11" fill="#8e44ad">SDA</text>
  <text x="605" y="254" text-anchor="middle" font-size="11" fill="#e08a00">SCL</text>

  <!-- ===== button on GPIO25 ===== -->
  <line x1="320" y1="340" x2="262" y2="340" stroke="#555" stroke-width="2.5"/>
  <circle cx="258" cy="340" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="254" y1="338" x2="222" y2="322" stroke="#222" stroke-width="2.5"/>
  <circle cx="218" cy="340" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="214" y1="340" x2="180" y2="340" stroke="#222" stroke-width="2.5"/>
  <line x1="180" y1="340" x2="180" y2="380" stroke="#222" stroke-width="2.5"/>
  <!-- ground symbol -->
  <line x1="166" y1="380" x2="194" y2="380" stroke="#222" stroke-width="2.5"/>
  <line x1="171" y1="386" x2="189" y2="386" stroke="#222" stroke-width="2.5"/>
  <line x1="176" y1="392" x2="184" y2="392" stroke="#222" stroke-width="2.5"/>
  <text x="238" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">SW1</text>
  <text x="238" y="414" text-anchor="middle" font-size="11" fill="#555">Joystick centre (M) or push button</text>
  <text x="238" y="429" text-anchor="middle" font-size="11" fill="#555">active-low, internal pull-up</text>
  <text x="238" y="444" text-anchor="middle" font-size="11" fill="#555">hold during reset = skip logger</text>

  <!-- legend -->
  <g font-size="11" fill="#555">
    <line x1="560" y1="420" x2="585" y2="420" stroke="#d62828" stroke-width="2.5"/><text x="592" y="424">3.3 V</text>
    <line x1="650" y1="420" x2="675" y2="420" stroke="#222" stroke-width="2.5"/><text x="682" y="424">GND</text>
    <text x="560" y="444">Common ground for all modules.</text>
  </g>
</svg>
